<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - Dona Medical Center</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Dona</a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="doctors.html">Team</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="auth-panel">
      <h1>Sign In / Register</h1>
      <p>Create a trial account to book appointments and explore the system.</p>

      <form id="auth-form">
        <label for="username">Username</label>
        <input id="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" required>

        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="button primary" type="submit">Sign In</button>
          <button id="logout" type="button" class="button outline">Sign Out</button>
        </div>
      </form>

      <div class="auth-status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Dona Medical Center. All rights reserved.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
